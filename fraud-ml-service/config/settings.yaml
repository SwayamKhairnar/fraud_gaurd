# Default service settings. Any value can be overridden by an environment variable (see .env.example).
service:
  name: fraud-ml-service
  version: 0.1.0
  host: 0.0.0.0
  port: 8000

contract:
  supported_schema_versions: ["1.0"]

model:
  dir: artifacts/models             # contains CURRENT (text file) and vN/ directories
  scored_types: [TRANSFER, CASH_OUT]
  require_feature_list_match: true  # refuse to become ready if feature_list.json differs from the code

logging:
  level: INFO
  format: json
  hash_account_ids: true            # log short hashes, never raw account IDs

metrics:
  enabled: true
  path: /metrics
  score_histogram_buckets: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
                            0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

security:
  api_key_enabled: false
